<!doctype html><html><head><meta charset="utf-8"><title>Opening gutter regression</title>
<style>body{margin:0;background:#302d2a;color:#eee;font:14px system-ui}header{padding:12px}button,input{margin:8px}#views{display:flex}section{width:50%}h2{padding-left:20px}canvas{width:100%!important;height:auto!important}pre{white-space:pre-wrap}</style></head>
<body><header><button id="run">Run geometry regression</button><button id="animate">Close / open</button><label>Opening angle <input id="angle" type="range" min="0" max="180" value="155"></label><output id="degrees"></output><pre id="result">Ready</pre></header><div id="views"><section><h2>Before</h2><div id="before"></div></section><section><h2>After</h2><div id="after"></div></section></div>
<script type="module">
import * as THREE from 'three'
import { BookModel } from '/src/engine/book.ts'
import { GutterFold } from '/src/engine/gutterFold.ts'
const original=GutterFold.prototype.point
const identity=(x,z)=>({x,z})
function texture(label){const c=document.createElement('canvas');c.width=512;c.height=736;const g=c.getContext('2d');g.fillStyle='#f3dfb7';g.fillRect(0,0,512,736);g.fillStyle='#473a28';g.font='26px serif';g.fillText(label,70,100);g.font='18px serif';for(let i=0;i<16;i++)g.fillText('The bound paper stays with the book.',70,170+i*26);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t}
const tex=[texture('Left page'),texture('Right page')],cover={outer:tex[0],inner:tex[1],cloth:new THREE.Color('#57665e'),glossy:false}
const views=['before','after'].map(id=>{const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(680,600);document.getElementById(id).append(renderer.domElement);const scene=new THREE.Scene();scene.background=new THREE.Color('#403733');scene.add(new THREE.AmbientLight(0xffffff,2));const light=new THREE.DirectionalLight(0xffffff,2);light.position.set(-5,6,12);scene.add(light);const camera=new THREE.PerspectiveCamera(40,680/600,.1,100);camera.position.set(0,-3,20);camera.lookAt(0,0,0);const book=new BookModel({leafCount:250,turned:1,open:true,cover,getTexture:p=>tex[p%2]});scene.add(book.group);return{id,renderer,scene,camera,book}})
function draw(degrees){document.getElementById('degrees').textContent=degrees.toFixed(1)+'°';for(const v of views){GutterFold.prototype.point=v.id==='before'?identity:original;v.book.psi=v.book.psiTarget=degrees/180*Math.PI;v.book.applyPsi(true);v.book.update(0);v.renderer.render(v.scene,v.camera)}GutterFold.prototype.point=original}
document.getElementById('angle').oninput=e=>draw(Number(e.target.value));draw(155)
let playing=false
document.getElementById('animate').onclick=()=>{if(playing)return;playing=true;const start=performance.now();function tick(now){const t=(now-start)/4000;if(t>=1){playing=false;draw(180);return}draw(180*Math.abs(2*t-1));requestAnimationFrame(tick)}requestAnimationFrame(tick)}
document.getElementById('run').onclick=async()=>{const out=document.getElementById('result');let checks=0,maxGap=0;try{for(const n of [8,250,1600])for(const turned of [0,1,Math.floor(n/2),n-1,n]){const b=new BookModel({leafCount:n,turned,open:true,cover,getTexture:()=>tex[0]});try{for(let degree=0;degree<=180;degree+=5){b.psi=b.psiTarget=degree/180*Math.PI;b.applyPsi(true);b.update(0);b.group.updateMatrixWorld(true);const leaf=b.pageSurface(-1);if(leaf){const p=leaf.pointAt(0,.5,new THREE.Vector3());leaf.mesh.localToWorld(p);b.group.worldToLocal(p);maxGap=Math.max(maxGap,Math.abs(p.x));if(Math.abs(p.x)>1e-6)throw Error(`Detached root: ${n}/${turned}/${degree}: ${p.x}`);checks++}for(const child of [b.blockL.mesh,leaf?.mesh].filter(Boolean)){for(const v of child.geometry.attributes.position.array)if(!Number.isFinite(v))throw Error('Nonfinite geometry')}}}finally{b.dispose()}out.textContent=JSON.stringify({checks,maxGap});await new Promise(requestAnimationFrame)}out.textContent=JSON.stringify({ok:true,checks,maxGap})}catch(e){out.textContent=String(e)}finally{draw(Number(document.getElementById('angle').value))}}
</script></body></html>
