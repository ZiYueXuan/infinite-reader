<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>便笺文字回归检查</title>
<style>body{margin:0;background:#27312c;color:#f3eedf;font:16px system-ui}main{max-width:1060px;margin:20px auto}h1{font-size:26px;font-weight:500}header p{color:#bec9bd}section{display:flex;gap:90px;margin:35px 30px}article{width:340px}h2{font-size:16px;font-weight:400;margin-bottom:25px}.sheet{width:320px;height:320px}canvas{width:100%;height:100%}button.case{border:1px solid #7a8876;padding:8px 12px;border-radius:10px;margin-right:10px;color:inherit}output{display:block;max-width:1060px;font:14px/1.7 system-ui;margin-top:24px;white-space:pre-wrap}</style></head>
<body><main><header><h1>便笺文字 · 编辑与桌面显示</h1><p>同一句中文完整换行，中文与引号使用同一字体；仅使用本地测试内容。</p></header><div id="cases"></div><section><article><h2>编辑状态（点击 Done 可验证退出）</h2><div id="anchor" class="sheet"></div><button class="case" id="edit">重新编辑</button></article><article><h2>退出编辑后的桌面贴图</h2><div id="preview" class="sheet"></div></article></section><output id="status">正在加载字体…</output><div id="root"></div></main>
<script type="module">
import React from 'react'
import {createRoot} from 'react-dom/client'
import {NoteEditor} from '/src/ui/Popovers.tsx'
import {useReader} from '/src/store/useReader.ts'
import {NoteObject} from '/src/engine/notes.ts'
import {ensureNoteFont} from '/src/engine/noteFonts.ts'
import {noteFont,wrapNoteText} from '/src/engine/noteText.ts'
import '/src/index.css'
// Isolated fixture: no storage/API/model calls, no changes to a reader's notes.
const realFetch=fetch.bind(window)
window.fetch=(input,init)=>{const u=new URL(input instanceof Request?input.url:String(input),location.href);if(u.origin!==location.origin||u.pathname.startsWith('/api/'))throw Error('External/API request blocked');return realFetch(input,init)}
const examples={中文:'注意：这里说的是“力量”，而不是“智慧”！',英文:'This is a note about “wisdom”, not “power”!',混排:'中文与 English 👨‍👩‍👧‍👦 一起换行。\n第二段：保留“引号”！',长便笺:'注意：这里说的是“力量”，而不是“智慧”！'.repeat(12)}
let annotation={id:'note-text-fixture',bookId:'fixture',color:'violet',kind:'highlight',quote:'',locator:{chapter:0,start:0,end:1},createdAt:0,updatedAt:0,note:{text:examples.中文,x:0,y:0,rot:0}}
const note=new NoteObject(annotation)
const anchor=document.getElementById('anchor'),preview=document.getElementById('preview'),status=document.getElementById('status')
const pose=()=>{const r=anchor.getBoundingClientRect();return{left:r.left,top:r.top,width:r.width,height:r.height,rotation:0}}
function edit(){useReader.setState({editingNote:{id:annotation.id,rect:pose()}});report()}
async function setText(text){annotation={...annotation,note:{...annotation.note,text}};note.setContent(annotation.color,text);useReader.setState({annotations:[annotation]});await ensureNoteFont(text);report()}
function report(){const g=document.createElement('canvas').getContext('2d'),font=noteFont(annotation.note.text);g.font=`${font.weight} ${640*.085}px ${font.family}`;g.fontKerning='none';const lines=wrapNoteText(annotation.note.text,640*.82,t=>g.measureText(t).width);status.textContent=`${useReader.getState().editingNote?'编辑中':'Done：已退出编辑'} · 字体 ${font.family.split(',')[0]}\n桌面换行：${JSON.stringify(lines)}\n字体状态：${document.fonts.check('500 20px "LXGW WenKai"',annotation.note.text)?'已加载':'回退中'} · 笔记原文未改变`}
useReader.setState({annotations:[annotation],scene:{noteScreenPose:pose,setEditingNote(){}},updateNoteText:async(_id,text)=>setText(text),restyle:async(_id,{color})=>{annotation={...annotation,color};await setText(annotation.note.text)},removeNote:async()=>{},finishNoteEditing:()=>{useReader.setState({editingNote:null});report()}})
createRoot(document.getElementById('root')).render(React.createElement(NoteEditor))
let image
function paint(){const next=note.mesh.material.map.image;if(image!==next){image=next;preview.replaceChildren(next);const copy=document.createElement('canvas');copy.width=copy.height=640;copy.getContext('2d').drawImage(next,0,0);anchor.replaceChildren(copy)}anchor.style.visibility=useReader.getState().editingNote?'hidden':'visible';requestAnimationFrame(paint)}
for(const [label,text]of Object.entries(examples)){const b=document.createElement('button');b.className='case';b.textContent=label;b.onclick=()=>setText(text);document.getElementById('cases').append(b)}
document.getElementById('edit').onclick=edit
paint();edit();await ensureNoteFont(annotation.note.text);report()
</script></body></html>
